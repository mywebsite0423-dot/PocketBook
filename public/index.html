<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5a">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Pocketbook – Budget & Finance</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d2420;--mu:#6b756f;--ac:#1f7a5a;--bd:#e4e2da;--bad:#c2410c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b221f;--tx:#e8ece9;--mu:#93a09a;--ac:#4cc29a;--bd:#2b3531;--bad:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b221f;--tx:#e8ece9;--mu:#93a09a;--ac:#4cc29a;--bd:#2b3531;--bad:#fb923c;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:20px 0 8px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid .card{margin:0;padding:10px}.k{font-size:12px;color:var(--mu)}.v{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.pos{color:var(--ac)}.neg{color:var(--bad)}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}.bar i.over{background:var(--bad)}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:4px 0 8px}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.x{background:transparent;color:var(--bad);padding:4px 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 0;font-size:11px}nav button b{display:block;font-size:20px}nav button.on{color:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;z-index:6;box-shadow:0 4px 14px #0004}
.sheet{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.seg button.on{background:var(--ac);color:#fff}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
textarea{width:100%;height:90px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);padding:8px}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<button class="fab" id="fab" onclick="openTx()" aria-label="Add transaction">+</button>
<div id="modal"></div>
<script>
const CE0=["Housing","Food","Transport","Tuition","School supplies","Bills","Health","Fun","Shopping","Savings","Other"],CI0=["Allowance","Scholarship","Part-time job","Salary","Other income"];
const COL=["#1f7a5a","#d97706","#2563eb","#9333ea","#dc2626","#0891b2","#65a30d","#db2777","#64748b"];
let S={cur:"USD",tx:[],bud:{},goals:[],bills:[],theme:""};
try{const x=JSON.parse(localStorage.getItem("pb1"));if(x)S=Object.assign(S,x)}catch(e){}
if(!S.ce)S.ce=[...CE0];if(!S.ci)S.ci=[...CI0];let CE=S.ce,CI=S.ci;
const col=c=>{let h=0;for(const ch of c)h=(h*31+ch.charCodeAt(0))|0;return COL[Math.abs(h)%COL.length]};
const save=()=>{try{localStorage.setItem("pb1",JSON.stringify(S))}catch(e){}window.onSaved&&window.onSaved()};
const $=id=>document.getElementById(id);
const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>{try{return new Intl.NumberFormat(undefined,{style:"currency",currency:S.cur}).format(n)}catch(x){return n.toFixed(2)}};
const today=()=>new Date().toISOString().slice(0,10),uid=()=>Math.random().toString(36).slice(2,9);
let tab="home",mon=today().slice(0,7),q="";
const shift=d=>{const [y,m]=mon.split("-").map(Number);const t=new Date(y,m-1+d,1);mon=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0");render()};
const monLabel=m=>new Date(m+"-01T00:00").toLocaleDateString(undefined,{month:"long",year:"numeric"});
const inM=m=>S.tx.filter(t=>t.d.startsWith(m));
const sum=(a,t)=>a.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
const byCat=a=>{const o={};a.filter(x=>x.t==="e").forEach(x=>o[x.c]=(o[x.c]||0)+x.a);return o};
function applyTheme(){if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme}
function nav(){const T=[["home","🏠","Home"],["act","🧾","Activity"],["bud","🎯","Budgets"],["goal","🐷","Goals"],["tools","🧰","More"]];
$("nav").innerHTML=T.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="tab='${t[0]}';render()"><b>${t[1]}</b>${t[2]}</button>`).join("");$("fab").style.display=tab==="act"||tab==="home"?"":"none"}
function monthBar(){return `<div class="row" style="margin-bottom:10px"><button class="g" onclick="shift(-1)">‹</button><strong>${monLabel(mon)}</strong><button class="g" onclick="shift(1)">›</button></div>`}
function home(){const a=inM(mon),inc=sum(a,"i"),ex=sum(a,"e"),net=inc-ex,rate=inc?Math.round(net/inc*100):0,cats=byCat(a),tot=ex||1;
let off=0;const segs=Object.entries(cats).sort((x,y)=>y[1]-x[1]).map(([c,v],i)=>{const l=v/tot*251.3,s=`<circle r="40" cx="60" cy="60" fill="none" stroke="${col(c)}" stroke-width="18" stroke-dasharray="${l} 251.3" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return [s,c,v]});
const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i,1);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),b=inM(k);ms.push([k.slice(5),sum(b,"i"),sum(b,"e")])}
const mx=Math.max(1,...ms.flatMap(m=>[m[1],m[2]]));
const bars=ms.map((m,i)=>`<rect x="${i*50+8}" y="${90-m[1]/mx*80}" width="16" height="${m[1]/mx*80}" rx="3" fill="var(--ac)"/><rect x="${i*50+26}" y="${90-m[2]/mx*80}" width="16" height="${m[2]/mx*80}" rx="3" fill="var(--bad)"/><text x="${i*50+25}" y="104" font-size="10" text-anchor="middle" fill="var(--mu)">${m[0]}</text>`).join("");
const warn=Object.keys(S.bud).filter(c=>S.bud[c]>0&&(cats[c]||0)>S.bud[c]);
const due=S.bills.filter(b=>b.paid!==mon.slice(0,7)&&mon===today().slice(0,7));
return `<h1>Pocketbook</h1><p class="mu">Your money, on your device.</p>${monthBar()}
<div class="grid"><div class="card"><div class="k">Income</div><div class="v pos">${fmt(inc)}</div></div><div class="card"><div class="k">Spent</div><div class="v neg">${fmt(ex)}</div></div><div class="card"><div class="k">Net</div><div class="v ${net<0?"neg":"pos"}">${fmt(net)}</div></div></div>
<div class="card" style="margin-top:10px"><div class="row"><span>Savings rate</span><strong>${rate}%</strong></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,rate))}%"></i></div></div>
${(()=>{const tl=Object.values(S.bud).reduce((s,v)=>s+(+v||0),0);if(!tl||mon!==today().slice(0,7))return"";const d=new Date(),left=new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1,rem=tl-ex;return `<div class="card row"><span>Safe to spend per day<div class="mu">${left} days left this month</div></span><strong class="${rem<0?"neg":"pos"}">${fmt(Math.max(0,rem)/left)}</strong></div>`})()}
${warn.length?`<div class="card neg">⚠️ Over budget: ${warn.map(e).join(", ")}</div>`:""}
${due.length?`<div class="card">🔔 ${due.length} bill${due.length>1?"s":""} unpaid this month: ${due.map(b=>e(b.n)).join(", ")}</div>`:""}
<h2>Spending by category</h2><div class="card">${segs.length?`<div class="row"><svg viewBox="0 0 120 120" width="130" height="130">${segs.map(s=>s[0]).join("")}</svg><div style="flex:1">${segs.map(s=>`<div class="row mu"><span><i class="sw" style="background:${col(s[1])}"></i>${e(s[1])}</span><span>${fmt(s[2])}</span></div>`).join("")}</div></div>`:`<span class="mu">No spending yet. Tap + to add your first transaction.</span>`}</div>
<h2>Last 6 months</h2><div class="card"><svg viewBox="0 0 300 110" width="100%">${bars}</svg><div class="mu"><i class="sw" style="background:var(--ac)"></i>Income <i class="sw" style="background:var(--bad);margin-left:10px"></i>Spent</div></div>`}
function act(){const a=inM(mon).filter(t=>(t.c+t.n).toLowerCase().includes(q.toLowerCase())).sort((x,y)=>y.d.localeCompare(x.d));
return `<h1>Activity</h1>${monthBar()}<input placeholder="Search notes or categories" value="${e(q)}" oninput="q=this.value;render(1)">
${a.length?a.map(t=>`<div class="card row" onclick="openTx('${t.id}')"><div><strong>${e(t.c)}</strong><div class="mu">${t.d}${t.n?" · "+e(t.n):""}</div></div><strong class="${t.t==="i"?"pos":"neg"}">${t.t==="i"?"+":"−"}${fmt(t.a)}</strong></div>`).join(""):`<p class="mu">Nothing here for ${monLabel(mon)}.</p>`}`}
function bud(){const sp=byCat(inM(mon)),tl=Object.values(S.bud).reduce((s,v)=>s+(+v||0),0);
return `<h1>Budgets</h1><p class="mu">Set a monthly limit per category.</p>${monthBar()}<div class="card row"><span>Total budgeted</span><strong>${fmt(tl)}</strong></div>
${CE.map((c,i)=>{const l=+S.bud[c]||0,s=sp[c]||0,p=l?Math.min(100,s/l*100):0;return `<div class="card"><div class="row"><input value="${e(c)}" style="margin:0" aria-label="Category name" onchange="renC(${i},this.value)"><input type="number" min="0" inputmode="decimal" style="width:110px;margin:0" placeholder="Limit" value="${l||""}" onchange="S.bud[CE[${i}]]=+this.value;save();render()"><button class="x" aria-label="Delete category" onclick="delC(${i})">✕</button></div><div class="mu">${fmt(s)} spent${l?` · ${l-s>=0?fmt(l-s)+" left":fmt(s-l)+" over"}`:""}</div><div class="bar"><i class="${s>l&&l?"over":""}" style="width:${p}%"></i></div></div>`}).join("")}<div class="card"><strong>Add category</strong><input id="nc" placeholder="e.g. Coffee"><input id="nl" type="number" inputmode="decimal" placeholder="Monthly limit (optional)"><button onclick="addC()">Add</button></div>`}
function goal(){return `<h1>Savings goals</h1>${S.goals.map(g=>{const p=Math.min(100,g.s/g.t*100);return `<div class="card"><div class="row"><input value="${e(g.n)}" style="margin:0" onchange="eG('${g.id}','n',this.value)"><button class="x" onclick="delG('${g.id}')">Delete</button></div><div class="row mu" style="margin-top:6px"><label>Saved<input type="number" inputmode="decimal" value="${g.s}" onchange="eG('${g.id}','s',this.value)"></label><label>Target<input type="number" inputmode="decimal" value="${g.t}" onchange="eG('${g.id}','t',this.value)"></label></div><div class="mu">${Math.round(p)}% reached</div><div class="bar"><i style="width:${p}%"></i></div><div class="row" style="margin-top:8px"><input id="gf${g.id}" type="number" inputmode="decimal" placeholder="Amount" style="margin:0"><button onclick="addG('${g.id}')">Add</button></div></div>`}).join("")||`<p class="mu">No goals yet.</p>`}
<div class="card"><strong>New goal</strong><input id="gn" placeholder="e.g. Emergency fund"><input id="gt" type="number" inputmode="decimal" placeholder="Target amount"><button onclick="newG()">Create goal</button></div>`}
function tools(){const cur=["USD","EUR","GBP","PHP","JPY","AUD","CAD","SGD","INR","CNY"];
return `<h1>Bills & tools</h1><h2>Recurring bills</h2>${S.bills.map(b=>`<div class="card"><input value="${e(b.n)}" onchange="eB('${b.id}','n',this.value)"><div class="row"><input type="number" inputmode="decimal" value="${b.a}" onchange="eB('${b.id}','a',this.value)"><input type="number" min="1" max="31" value="${b.d}" onchange="eB('${b.id}','d',this.value)"></div><div class="row"><span class="mu">Amount · day of month${b.paid===today().slice(0,7)?" · ✅ paid":""}</span><span><button class="g" onclick="payB('${b.id}')">Pay</button><button class="x" onclick="if(confirm('Delete this bill?')){S.bills=S.bills.filter(x=>x.id!=='${b.id}');save();render()}">✕</button></span></div></div>`).join("")}
<div class="card"><input id="bn" placeholder="Bill name"><input id="ba" type="number" inputmode="decimal" placeholder="Amount"><input id="bd" type="number" min="1" max="31" placeholder="Day of month"><button onclick="newB()">Add bill</button></div>
<h2>Loan calculator</h2><div class="card"><input id="lp" type="number" placeholder="Loan amount" oninput="calc()"><input id="lr" type="number" placeholder="Annual interest %" oninput="calc()"><input id="ln" type="number" placeholder="Months" oninput="calc()"><div id="lo" class="mu">Enter details to see the monthly payment.</div></div>
<h2>Savings growth</h2><div class="card"><input id="sp" type="number" placeholder="Starting amount" oninput="calc2()"><input id="sm" type="number" placeholder="Monthly deposit" oninput="calc2()"><input id="sr" type="number" placeholder="Annual return %" oninput="calc2()"><input id="sy" type="number" placeholder="Years" oninput="calc2()"><div id="so" class="mu">Enter details to see projected value.</div></div>
<h2>Income categories</h2><div class="card">${CI.map((c,i)=>`<div class="row"><input value="${e(c)}" onchange="renI(${i},this.value)"><button class="x" onclick="delI(${i})">✕</button></div>`).join("")}<div class="row"><input id="ni" placeholder="New income type"><button onclick="addI()">Add</button></div></div><h2>Cloud sync</h2><div class="card"><div id="cs" class="mu">${window.PB_STATUS||"Starting…"}</div><button style="margin-top:8px" onclick="window.cloudToggle&&cloudToggle()">${window.PB.user?"Sign out":"Sign in with Google"}</button></div><h2>Settings</h2><div class="card"><label class="k">Currency</label><select onchange="S.cur=this.value;save();render()">${cur.map(c=>`<option ${c===S.cur?"selected":""}>${c}</option>`).join("")}</select>
<label class="k">Theme</label><select onchange="S.theme=this.value;save();applyTheme()"><option value="">Match device</option><option value="light" ${S.theme==="light"?"selected":""}>Light</option><option value="dark" ${S.theme==="dark"?"selected":""}>Dark</option></select></div>
<div class="card"><strong>Backup</strong><p class="mu">Copy this text to back up. Paste a backup below to restore.</p><textarea id="bk" readonly onclick="this.select()">${e(JSON.stringify(S))}</textarea><textarea id="rs" placeholder="Paste backup here"></textarea><div class="row"><button onclick="restore()">Restore</button><button class="x" onclick="if(confirm('Delete all data?')){localStorage.removeItem('pb1');location.reload()}">Erase all</button></div></div>`}
function render(keep){nav();const f={home,act,bud,goal,tools}[tab];const a=document.activeElement,id=a&&a.id;$("app").innerHTML=f();if(keep){const i=document.querySelector("#app input");if(i){i.focus();i.setSelectionRange(99,99)}}}
let ty="e";
function openTx(id){const t=S.tx.find(x=>x.id===id)||{t:ty,a:"",c:"",d:today(),n:""};ty=t.t;
let cats=(ty==="e"?CE:CI).slice();if(t.c&&!cats.includes(t.c))cats.push(t.c);$("modal").innerHTML=`<div class="sheet"><div><div class="seg"><button class="${ty==="e"?"on":""}" onclick="ty='e';swap('${id||""}')">Expense</button><button class="${ty==="i"?"on":""}" onclick="ty='i';swap('${id||""}')">Income</button></div>
<input id="ta" type="number" inputmode="decimal" placeholder="Amount" value="${t.a}"><select id="tc">${cats.map(c=>`<option ${c===t.c?"selected":""}>${c}</option>`).join("")}</select><input id="td" type="date" value="${t.d}"><input id="tn" placeholder="Note (optional)" value="${e(t.n)}">
<div class="row"><button onclick="saveTx('${id||""}')">Save</button><button class="g" onclick="closeM()">Cancel</button>${id?`<button class="x" onclick="delTx('${id}')">Delete</button>`:""}</div></div></div>`}
function swap(id){const v=["ta","td","tn"].map(i=>$(i).value);openTx(id);$("ta").value=v[0];$("td").value=v[1];$("tn").value=v[2]}
const closeM=()=>$("modal").innerHTML="";
function saveTx(id){const a=+$("ta").value;if(!(a>0)){$("ta").focus();return}const o={id:id||uid(),t:ty,a,c:$("tc").value,d:$("td").value||today(),n:$("tn").value.trim()};
if(id)S.tx[S.tx.findIndex(x=>x.id===id)]=o;else S.tx.push(o);save();closeM();render()}
function delTx(id){S.tx=S.tx.filter(x=>x.id!==id);save();closeM();render()}
function newG(){const n=$("gn").value.trim(),t=+$("gt").value;if(!n||!(t>0))return;S.goals.push({id:uid(),n,t,s:0});save();render()}
function addG(id){const v=+$("gf"+id).value;if(!(v>0))return;S.goals.find(g=>g.id===id).s+=v;save();render()}
function delG(id){S.goals=S.goals.filter(g=>g.id!==id);save();render()}
function newB(){const n=$("bn").value.trim(),a=+$("ba").value,d=+$("bd").value||1;if(!n||!(a>0))return;S.bills.push({id:uid(),n,a,d});save();render()}
function payB(id){const b=S.bills.find(x=>x.id===id);S.tx.push({id:uid(),t:"e",a:b.a,c:"Bills",d:today(),n:b.n});b.paid=today().slice(0,7);save();render()}
function calc(){const P=+$("lp").value,r=+$("lr").value/1200,n=+$("ln").value;if(!P||!n)return;const m=r?P*r/(1-Math.pow(1+r,-n)):P/n;$("lo").innerHTML=`Monthly payment: <strong>${fmt(m)}</strong><br>Total paid: ${fmt(m*n)} · Interest: ${fmt(m*n-P)}`}
function calc2(){const P=+$("sp").value,M=+$("sm").value,r=+$("sr").value/1200,n=(+$("sy").value)*12;if(!n)return;const g=Math.pow(1+r,n),fv=P*g+M*(r?(g-1)/r:n),dep=P+M*n;$("so").innerHTML=`Projected value: <strong>${fmt(fv)}</strong><br>You deposit ${fmt(dep)} · Growth ${fmt(fv-dep)}`}
function renC(i,v){v=v.trim();const o=CE[i];if(!v||v===o||CE.includes(v)){render();return}CE[i]=v;if(S.bud[o]!==undefined){S.bud[v]=S.bud[o];delete S.bud[o]}S.tx.forEach(t=>{if(t.t==="e"&&t.c===o)t.c=v});save();render()}
function delC(i){if(!confirm("Delete this category? Past transactions keep their label."))return;delete S.bud[CE[i]];CE.splice(i,1);save();render()}
function addC(){const n=$("nc").value.trim(),l=+$("nl").value;if(!n||CE.includes(n))return;CE.push(n);if(l>0)S.bud[n]=l;save();render()}
function renI(i,v){v=v.trim();const o=CI[i];if(!v||v===o||CI.includes(v)){render();return}CI[i]=v;S.tx.forEach(t=>{if(t.t==="i"&&t.c===o)t.c=v});save();render()}
function delI(i){if(!confirm("Delete this income type?"))return;CI.splice(i,1);save();render()}
function addI(){const n=$("ni").value.trim();if(!n||CI.includes(n))return;CI.push(n);save();render()}
function eG(id,k,v){const g=S.goals.find(x=>x.id===id);if(k==="n"){if(v.trim())g.n=v.trim()}else{v=+v;if(k==="t"&&!(v>0)){render();return}if(v>=0)g[k]=v}save();render()}
function eB(id,k,v){const b=S.bills.find(x=>x.id===id);if(k==="n"){if(v.trim())b.n=v.trim()}else{v=+v;if(v>0)b[k]=v}save();render()}
function restore(){try{const x=JSON.parse($("rs").value);if(!x||!Array.isArray(x.tx))throw 0;S=Object.assign({cur:"USD",tx:[],bud:{},goals:[],bills:[],theme:""},x);if(!S.ce)S.ce=[...CE0];if(!S.ci)S.ci=[...CI0];CE=S.ce;CI=S.ci;save();applyTheme();render()}catch(err){alert("That doesn’t look like a valid backup.")}}
window.PB={user:null,get:()=>S,set:x=>{S=Object.assign({cur:"USD",tx:[],bud:{},goals:[],bills:[],theme:""},x);if(!S.ce)S.ce=[...CE0];if(!S.ci)S.ci=[...CI0];CE=S.ce;CI=S.ci;try{localStorage.setItem("pb1",JSON.stringify(S))}catch(e){}applyTheme();render()},setStatus:m=>{window.PB_STATUS=m;if(tab==="tools"&&!(document.activeElement&&document.activeElement.tagName==="INPUT"))render()}};
applyTheme();render();
</script>
<script type="module" src="firebase-sync.js"></script></body></html>
